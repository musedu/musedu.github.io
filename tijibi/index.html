<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THANK YOU TINTAAA</title>
    <style>
        :root {
            --glitch-speed: 0.1s;
        }

        body {
            background: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', sans-serif;
            /* 1. Extreme Screen Shake */
            animation: body-shake 0.2s infinite;
        }

        /* 2. RGB Split & High-Frequency Glitch Text */
        .glitch-wrapper {
            position: relative;
            color: #fff;
            font-size: 8vw;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
        }

        .glitch-wrapper::before,
        .glitch-wrapper::after {
            content: "THANK YOU TINTAAA";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Red Split Layer */
        .glitch-wrapper::before {
            left: 5px;
            text-shadow: -5px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        /* Cyan Split Layer */
        .glitch-wrapper::after {
            left: -5px;
            text-shadow: -5px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        /* 3. Seizure-inducing Flash Background */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 100;
            animation: strobe 0.05s infinite;
        }

        @keyframes body-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes strobe {
            0% { background: rgba(255,0,0,0.2); }
            25% { background: rgba(0,255,0,0.2); }
            50% { background: rgba(0,0,255,0.2); }
            75% { background: rgba(255,255,0,0.2); }
            100% { background: rgba(255,0,255,0.2); }
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 10px, 0); }
            20% { clip: rect(85px, 9999px, 140px, 0); }
            40% { clip: rect(10px, 9999px, 60px, 0); }
            100% { clip: rect(130px, 9999px, 5px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(120px, 9999px, 50px, 0); }
            25% { clip: rect(25px, 9999px, 80px, 0); }
            75% { clip: rect(60px, 9999px, 150px, 0); }
            100% { clip: rect(10px, 9999px, 10px, 0); }
        }
    </style>
</head>
<body>
    <div class="flash-overlay"></div>
    <div class="glitch-wrapper">THANK YOU TINTAAA</div>

    <script>
        // Chaotic Mouse Particles
        document.addEventListener('mousemove', (e) => {
            const particle = document.createElement('div');
            particle.style.position = 'fixed';
            particle.style.left = e.clientX + 'px';
            particle.style.top = e.clientY + 'px';
            particle.style.width = Math.random() * 50 + 'px';
            particle.style.height = Math.random() * 50 + 'px';
            particle.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '50';
            particle.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(particle);

            setTimeout(() => particle.remove(), 200);
        });
    </script>
</body>
</html>
